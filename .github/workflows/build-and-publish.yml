name: Build and Publish

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "tf/**"
      - ".github/workflows/build-and-publish.yml"
  workflow_dispatch:
    inputs:
      deployments_ref:
        description: >-
          pneuma-deployments git ref (sha/tag/branch) to bake the
          Terraform modules from. Leave blank to use env.DEPLOYMENTS_REF
          (the standing pin below).
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  OWNER: deanmak13
  IMAGE_NAME: pneuma-terraformer
  # Standing pin for the pneuma-deployments ref baked into the image.
  # Bump this when infrastructure/terraform/modules or
  # infrastructure/terraform/standalone changes shape; for a one-off
  # rebuild against a different ref, use workflow_dispatch(deployments_ref)
  # instead of editing this default. Verified locally 2026-07-11 against
  # modules/tenant + standalone/platform-secrets-apply (P3 build proof).
  # Bumped 2026-07-17 (P5.2) to pneuma-deployments#1283's merge commit —
  # the ref that first adds modules/platform-bus-topology/ +
  # standalone/platform-bus-topology-apply/, which this PR's
  # TerraformRunner.reconcile_platform_bus_topology now reads from
  # settings.terraform_standalone_root at runtime. Without this bump the
  # baked image would lack that directory entirely.
  DEPLOYMENTS_REF: d34df5c16018bfba24bd97a16609c571873eae5d

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pneuma-deployments ref
        id: deployments_ref
        env:
          # workflow_dispatch input — routed through env: (never inlined
          # into the script body) so it can't be interpreted as shell.
          INPUT_DEPLOYMENTS_REF: ${{ github.event.inputs.deployments_ref }}
        run: |
          ref="${INPUT_DEPLOYMENTS_REF}"
          if [ -z "$ref" ]; then
            ref="${DEPLOYMENTS_REF}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Baking pneuma-deployments@${ref}"

      # Bakes the tenant + platform-secrets Terraform modules into the
      # image build context (Dockerfile COPYs from _deployments/). A
      # read-only fine-grained PAT (DEPLOYMENTS_RO_TOKEN) is required
      # because pneuma-deployments is a private repo the GITHUB_TOKEN of
      # this repo cannot read. HUMAN GATE: DEPLOYMENTS_RO_TOKEN must be
      # seeded as a repo secret before this workflow can run end to end.
      - name: Checkout pneuma-deployments (pinned Terraform modules)
        uses: actions/checkout@v4
        with:
          repository: deanmak13/pneuma-deployments
          ref: ${{ steps.deployments_ref.outputs.ref }}
          token: ${{ secrets.DEPLOYMENTS_RO_TOKEN }}
          path: _deployments
          sparse-checkout: |
            infrastructure/terraform/modules
            infrastructure/terraform/standalone
          sparse-checkout-cone-mode: true

      - name: Compute tags
        id: tags
        env:
          GH_SHA: ${{ github.sha }}
          DEPLOYMENTS_REF: ${{ steps.deployments_ref.outputs.ref }}
        run: |
          image="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          short="${GH_SHA:0:7}"
          # No :latest tag — a floating tag on a baked-module image invites
          # silent drift between "what's deployed" and "what module shape
          # it was baked from".
          #
          # The tag must be content-addressed over BOTH inputs. This image is
          # (terraformer source) + (pneuma-deployments Terraform modules baked
          # in at build time), so tagging by the terraformer SHA alone let two
          # DIFFERENT images share one tag whenever only the modules changed —
          # exactly the drift the note above warns about. Observed 2026-07-27:
          # a modules-only fix republished sha-d7b04c7 with a new digest, the
          # running pod kept the old digest (pullPolicy IfNotPresent), and
          # ArgoCD saw no change because the tag was identical.
          tfshort="${DEPLOYMENTS_REF:0:7}"
          tag="sha-${short}-tf${tfshort}"
          echo "tags=${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${image}:${tag}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DEPLOYMENTS_REF=${{ steps.deployments_ref.outputs.ref }}
          cache-from: type=gha,scope=terraformer
          cache-to: type=gha,scope=terraformer,mode=max
