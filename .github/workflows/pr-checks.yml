name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in lockstep with the Dockerfile's `proto` stage pin — see
  # docs/plans/2026-07-11-terraformer-onboarding-provisioning.md §2
  # "verify-before-pin" gate. 0.84.0 (proto PR #155): apply_tenant_resources/
  # destroy_tenant_resources reclassified effect=mutate_pneuma_state (was
  # perform_external_action) — see the Dockerfile's `proto` stage comment.
  PROTO_IMAGE: ghcr.io/deanmak13/pneuma-proto:0.84.0

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Guard against an unpinned pneuma-proto base image
        run: |
          if grep -E 'pneuma-proto:latest' Dockerfile; then
            echo "::error::Dockerfile pins ghcr.io/deanmak13/pneuma-proto:latest — pin an explicit version tag (see the verify-before-pin gate in docs/plans/2026-07-11-terraformer-onboarding-provisioning.md)." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # grpc_server.py + capability_sync.py import pneuma_proto
      # unconditionally (no try/except fallback) — unlike
      # services.common.*, which stays optional until pneuma-common
      # ships (P4). The wheel is not on PyPI; extract it from the same
      # pinned GHCR wheel-carrier image the Dockerfile's `proto` stage
      # consumes.
      - name: Fetch pinned pneuma-proto wheel
        run: |
          docker pull "${PROTO_IMAGE}"
          cid=$(docker create --entrypoint /bin/sh "${PROTO_IMAGE}" -c true)
          docker cp "${cid}:/wheels" ./proto-wheels
          docker rm "${cid}" >/dev/null

      - name: Install package + dev deps
        run: |
          pip install --upgrade pip wheel
          pip install --find-links ./proto-wheels pneuma_proto
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check services/ tests/

      - name: mypy
        run: mypy services/

      # Puts the real `terraform` binary on PATH for the pytest run.
      # test_generated_vault_provider_hcl_passes_real_terraform_validate
      # skips itself when terraform is absent (so a local run stays fast),
      # which means CI is the place that must always have it. Without this
      # step that guard silently no-ops and the 2026-07-28 class of bug —
      # generated HCL naming a block the provider does not define — sails
      # through green again.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: pytest
        run: |
          pytest tests/ \
            -q --tb=short --maxfail=5 \
            --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
