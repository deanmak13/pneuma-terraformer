name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          pip install --upgrade pip wheel
          # services.common.* and pneuma_proto.* are optional runtime
          # imports (try/except in services/terraformer/src/main.py); the
          # service starts degraded if absent. Lint/test does not need them.
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check services/ tests/

      - name: mypy
        run: mypy services/

      - name: pytest
        run: |
          pytest tests/ \
            -q --tb=short --maxfail=5 \
            --cov=services/terraformer \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
