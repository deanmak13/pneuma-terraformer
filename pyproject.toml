[project]
name = "pneuma-terraformer"
version = "0.1.0"
description = "Pneuma Terraform runner — declarative tenant-resource lifecycle"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Dean Mak", email = "dean.mak13@gmail.com" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "grpcio>=1.66,<2.0",
    "grpcio-tools>=1.66,<2.0",
    "protobuf>=5.27,<6.0",
]

# The Dockerfile installs the generated pneuma-proto wheel from
# ghcr.io/deanmak13/pneuma-proto. It is not listed here because the wheel
# is not published to PyPI.

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["services/terraformer"]
omit = [
    "services/__init__.py",
    "services/terraformer/__init__.py",
    "services/terraformer/src/__init__.py",
    "services/terraformer/src/main.py",  # FastAPI app glue — exercised by integration tests, not unit
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "^\\s*pass\\s*$",
    "from services\\.common",  # the optional-import fallback branch
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Matches pneuma-engine's selection (E/F/W) plus I (import sort) and B
# (bugbear) for new-code hygiene. ASYNC is deliberately NOT enabled —
# the inherited terraform_runner._spawn_terraform(workdir, args, timeout)
# signature would trigger ASYNC109 with no clean asyncio.timeout()
# refactor that preserves the call-site contract.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
# Same pragmatic stance as pneuma-engine: catch obvious type bugs but
# don't gate on strict-mode false-positives — pydantic-settings
# `Settings()` resolves kwargs from env at runtime (mypy can't see
# that), and inherited modules predate type hints. Tighten module-by-
# module once pneuma-common ships with full type coverage.
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # services.common.* + pneuma_proto.* deliberately optional
# Inherited modules predating annotations — disable the no-untyped-def
# and call-arg errors that flag legitimate pydantic-settings runtime
# behavior. New code in this repo gets annotations from the start.
disable_error_code = ["no-untyped-def", "call-arg", "attr-defined"]
